name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      # Sem ANTHROPIC_API_KEY: os testes cobrem a recuperação e o tratamento de erro da API, sem chamadas reais.
      - run: pytest -q
